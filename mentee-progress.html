<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progress Tracker — MentorBay</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='48' font-size='48' font-weight='bold' fill='%230B2A4A'%3EM%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>tailwind.config={theme:{extend:{colors:{navy:{DEFAULT:'#0B2A4A',700:'#103a63',600:'#16487a',50:'#eef3f9'},teal:{DEFAULT:'#1FA2BE',600:'#178098',400:'#3bb8d1',50:'#e9f7fa'}},fontFamily:{sans:['Inter','ui-sans-serif','system-ui']},boxShadow:{card:'0 4px 20px -6px rgba(11,42,74,0.12)'}}}}</script>
</head>
<body class="font-sans text-slate-700 bg-slate-50 antialiased">
<div class="flex min-h-screen">
  <aside id="sidebar" class="fixed lg:sticky top-0 inset-y-0 left-0 z-40 w-64 h-screen bg-white border-r border-slate-100 flex flex-col -translate-x-full lg:translate-x-0 transition-transform">
    <div class="p-5 border-b border-slate-100"><a href="index.html" class="flex items-center gap-2"><svg viewBox="0 0 64 64" class="h-8 w-8"><circle cx="32" cy="8" r="6" fill="#1FA2BE"/><circle cx="55" cy="20" r="6" fill="#0B2A4A"/><circle cx="55" cy="44" r="6" fill="#1FA2BE"/><circle cx="32" cy="56" r="6" fill="#0B2A4A"/><circle cx="9" cy="44" r="6" fill="#1FA2BE"/><circle cx="9" cy="20" r="6" fill="#0B2A4A"/><text x="32" y="41" text-anchor="middle" font-size="26" font-weight="800" fill="#0B2A4A">M</text></svg><span class="text-lg font-extrabold text-navy">Mentor<span class="text-teal">Bay</span></span></a></div>
    <nav class="flex-1 overflow-y-auto p-3 space-y-1 text-sm font-medium">
      <a href="mentee-dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Dashboard</a>
      <a href="mentee-my-mentor.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>My Mentor</a>
      <a href="mentee-programs.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>My Programs</a>
      <a href="mentee-progress.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-navy text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>Progress Tracker</a>
      <a href="mentee-sessions.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Sessions</a>
      <a href="events.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7M3 7l2-3h14l2 3M3 7h18"/></svg>Events</a>
      <a href="mentee-certificates.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M8.21 13.89 7 23l5-3 5 3-1.21-9.12"/></svg>Certificates</a>
      <a href="mentee-messages.html" class="flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><span class="flex items-center gap-3"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Messages</span><span class="text-xs bg-teal text-white rounded-full px-2 py-0.5">2</span></a>
      <a href="resources.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M2 7l10-5 10 5-10 5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>Resources</a>
      <a href="mentee-settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg>Settings</a>
    </nav>
  </aside>
  <div id="overlay" class="fixed inset-0 bg-black/30 z-30 hidden lg:hidden"></div>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-100"><div class="flex items-center gap-4 px-4 sm:px-6 h-16"><button id="menuBtn" class="lg:hidden p-2 text-navy"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><h1 class="font-bold text-navy">Progress Tracker</h1><div class="flex items-center gap-2 ml-auto"><img src="images/sd728rcfrx0j7wrnhaa2zh0ya188vf7q.jpg" class="w-9 h-9 rounded-full object-cover" alt="Janet"><div class="hidden sm:block leading-tight"><p class="text-sm font-bold text-navy">Janet Mwangi</p><p class="text-xs text-slate-400">Mentee</p></div></div></div></header>

    <main class="p-4 sm:p-6 lg:p-8 max-w-5xl">
      <!-- summary stats -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-white rounded-2xl shadow-card p-5 text-center"><p class="text-2xl font-extrabold text-navy">72%</p><p class="text-xs text-slate-400">Overall Progress</p></div>
        <div class="bg-white rounded-2xl shadow-card p-5 text-center"><p class="text-2xl font-extrabold text-navy">8/12</p><p class="text-xs text-slate-400">Sessions Done</p></div>
        <div class="bg-white rounded-2xl shadow-card p-5 text-center"><p class="text-2xl font-extrabold text-navy">6</p><p class="text-xs text-slate-400">Skills Acquired</p></div>
        <div class="bg-white rounded-2xl shadow-card p-5 text-center"><p class="text-2xl font-extrabold text-navy">1</p><p class="text-xs text-slate-400">Certificates</p></div>
      </div>

      <div class="grid lg:grid-cols-2 gap-6 mt-6">
        <!-- goals -->
        <div class="bg-white rounded-2xl shadow-card p-6">
          <h3 class="font-bold text-navy mb-4">Learning Goals</h3>
          <div class="space-y-4" id="goals"></div>
        </div>
        <!-- skills -->
        <div class="bg-white rounded-2xl shadow-card p-6">
          <h3 class="font-bold text-navy mb-4">Skills Acquired</h3>
          <div class="space-y-3" id="skills"></div>
        </div>
      </div>

      <!-- milestones -->
      <div class="bg-white rounded-2xl shadow-card p-6 mt-6">
        <h3 class="font-bold text-navy mb-5">Milestones & Achievements</h3>
        <div class="space-y-5" id="milestones"></div>
      </div>
    </main>
  </div>
</div>
<script>
  const menuBtn=document.getElementById('menuBtn'),sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay');
  menuBtn.addEventListener('click',()=>{sidebar.classList.remove('-translate-x-full');overlay.classList.remove('hidden');});
  overlay.addEventListener('click',()=>{sidebar.classList.add('-translate-x-full');overlay.classList.add('hidden');});

  document.getElementById('goals').innerHTML=[['Land a job in Tech',80],['Improve Public Speaking',60],['Build a Strong Personal Brand',75],['Expand Professional Network',45]].map(([g,p])=>`
    <div><div class="flex justify-between text-sm mb-1"><span class="text-slate-600">${g}</span><span class="font-semibold text-navy">${p}%</span></div><div class="h-2 bg-slate-100 rounded-full"><div class="h-full bg-teal rounded-full" style="width:${p}%"></div></div></div>`).join('');

  document.getElementById('skills').innerHTML=[['Resume Writing','Mastered'],['Interview Skills','Advanced'],['LinkedIn Optimization','Mastered'],['Personal Branding','Intermediate'],['Networking','Intermediate'],['Public Speaking','Learning']].map(([s,l])=>`
    <div class="flex items-center justify-between"><span class="text-sm text-slate-600">${s}</span><span class="text-xs font-semibold ${l==='Mastered'?'text-teal-600 bg-teal-50':l==='Advanced'?'text-indigo-500 bg-indigo-50':'text-slate-500 bg-slate-100'} px-2.5 py-1 rounded-full">${l}</span></div>`).join('');

  document.getElementById('milestones').innerHTML=[['Networking Pro','Connected with 10+ professionals','Jun 9, 2026',1],['First Session Complete','Completed your onboarding session','May 30, 2026',1],['Halfway Hero','Reached 50% program completion','Jun 1, 2026',1],['Certified','Earned your first certificate','Pending',0]].map(([t,d,date,done])=>`
    <div class="flex items-center gap-4"><span class="w-10 h-10 rounded-full ${done?'bg-teal-50 text-teal':'bg-slate-100 text-slate-300'} grid place-items-center shrink-0"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M8.21 13.89 7 23l5-3 5 3-1.21-9.12"/></svg></span><div class="flex-1"><p class="text-sm font-semibold text-navy">${t}</p><p class="text-xs text-slate-400">${d}</p></div><span class="text-xs ${done?'text-teal-600 font-semibold':'text-slate-400'}">${date}</span></div>`).join('');
</script>
</body>
</html>
