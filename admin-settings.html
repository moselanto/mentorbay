<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Platform Settings — MentorBay Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='48' font-size='48' font-weight='bold' fill='%230B2A4A'%3EM%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>tailwind.config={theme:{extend:{colors:{navy:{DEFAULT:'#0B2A4A',700:'#103a63',600:'#16487a',50:'#eef3f9'},teal:{DEFAULT:'#1FA2BE',600:'#178098',400:'#3bb8d1',50:'#e9f7fa'}},fontFamily:{sans:['Inter','ui-sans-serif','system-ui']},boxShadow:{card:'0 4px 20px -6px rgba(11,42,74,0.12)'}}}}</script>
</head>
<body class="font-sans text-slate-700 bg-slate-50 antialiased">
<div class="flex min-h-screen">
  <aside id="sidebar" class="fixed lg:sticky top-0 inset-y-0 left-0 z-40 w-64 h-screen bg-navy text-slate-300 flex flex-col -translate-x-full lg:translate-x-0 transition-transform">
    <div class="p-5 border-b border-white/10"><a href="index.html" class="flex items-center gap-2"><svg viewBox="0 0 64 64" class="h-8 w-8"><circle cx="32" cy="8" r="6" fill="#3bb8d1"/><circle cx="55" cy="20" r="6" fill="#fff"/><circle cx="55" cy="44" r="6" fill="#3bb8d1"/><circle cx="32" cy="56" r="6" fill="#fff"/><circle cx="9" cy="44" r="6" fill="#3bb8d1"/><circle cx="9" cy="20" r="6" fill="#fff"/><text x="32" y="41" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">M</text></svg><span class="text-lg font-extrabold text-white">Mentor<span class="text-teal-400">Bay</span></span></a><p class="text-[10px] font-semibold text-teal-400 mt-1 ml-10 -mt-1">ADMIN</p></div>
    <nav class="flex-1 overflow-y-auto p-3 space-y-1 text-sm font-medium">
      <a href="admin-dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Dashboard</a>
      <a href="admin-approvals.html" class="flex items-center justify-between px-3 py-2.5 rounded-lg hover:bg-white/5"><span class="flex items-center gap-3"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 11 2 2 4-4"/></svg>Mentor Approvals</span><span class="text-xs bg-teal text-white rounded-full px-2 py-0.5">5</span></a>
      <a href="admin-users.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>Users</a>
      <a href="admin-moderation.html" class="flex items-center justify-between px-3 py-2.5 rounded-lg hover:bg-white/5"><span class="flex items-center gap-3"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Content</span><span class="text-xs bg-rose-500 text-white rounded-full px-2 py-0.5">2</span></a>
      <a href="admin-reports.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="8"/><rect x="12" y="6" width="3" height="12"/><rect x="17" y="13" width="3" height="5"/></svg>Reports</a>
      <a href="admin-settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-white/10 text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg>Settings</a>
    </nav>
  </aside>
  <div id="overlay" class="fixed inset-0 bg-black/30 z-30 hidden lg:hidden"></div>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-100"><div class="flex items-center gap-4 px-4 sm:px-6 h-16"><button id="menuBtn" class="lg:hidden p-2 text-navy"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><h1 class="font-bold text-navy">Platform Settings</h1></div></header>

    <main class="p-4 sm:p-6 lg:p-8 max-w-3xl space-y-6">
      <div class="bg-white rounded-2xl shadow-card p-6">
        <h3 class="font-bold text-navy mb-4">General</h3>
        <div class="grid sm:grid-cols-2 gap-4">
          <div><label class="block text-sm font-semibold text-navy mb-1">Platform name</label><input type="text" value="MentorBay" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-teal outline-none" /></div>
          <div><label class="block text-sm font-semibold text-navy mb-1">Support email</label><input type="email" value="support@mentorbay.com" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-teal outline-none" /></div>
          <div class="sm:col-span-2"><label class="block text-sm font-semibold text-navy mb-1">Tagline</label><input type="text" value="Connect · Grow · Succeed" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-teal outline-none" /></div>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-card p-6">
        <div class="flex items-center justify-between mb-4"><h3 class="font-bold text-navy">Categories</h3><button class="text-sm font-semibold text-teal-600">+ Add category</button></div>
        <div class="flex flex-wrap gap-2" id="cats"></div>
      </div>

      <div class="bg-white rounded-2xl shadow-card p-6">
        <h3 class="font-bold text-navy mb-4">Monetization</h3>
        <label class="flex items-center justify-between py-2"><span class="text-sm text-slate-600">Enable paid programs <span class="text-xs text-slate-400">(coming soon)</span></span><input type="checkbox" disabled class="sr-only peer"><span class="relative w-11 h-6 bg-slate-200 rounded-full peer-checked:bg-teal after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:w-5 after:h-5 after:bg-white after:rounded-full opacity-50"></span></label>
        <div class="mt-2"><label class="block text-sm font-semibold text-navy mb-1">Platform commission (%)</label><input type="number" value="0" disabled class="w-32 px-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-400" /><p class="text-xs text-slate-400 mt-1">All mentorship is free during launch.</p></div>
      </div>

      <div class="bg-white rounded-2xl shadow-card p-6">
        <h3 class="font-bold text-navy mb-4">Platform Controls</h3>
        <div class="space-y-1" id="toggles"></div>
      </div>

      <div class="flex items-center gap-3">
        <button id="saveBtn" class="px-6 py-3 bg-navy text-white font-semibold rounded-lg hover:bg-navy-700 transition">Save Settings</button>
        <span id="savedMsg" class="hidden text-sm text-teal-600 font-medium">✓ Settings saved</span>
      </div>
    </main>
  </div>
</div>
<script>
  const menuBtn=document.getElementById('menuBtn'),sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay');
  menuBtn.addEventListener('click',()=>{sidebar.classList.remove('-translate-x-full');overlay.classList.remove('hidden');});
  overlay.addEventListener('click',()=>{sidebar.classList.add('-translate-x-full');overlay.classList.add('hidden');});
  const cats=['Technology','Business','Marketing','Finance','Design','Data','Leadership','Entrepreneurship','HR & People'];
  document.getElementById('cats').innerHTML=cats.map(c=>`<span class="flex items-center gap-1 text-sm font-medium text-teal-600 bg-teal-50 px-3 py-1 rounded-full">${c}<button class="text-teal-400 hover:text-rose-500">✕</button></span>`).join('');
  const toggles=[['Require mentor approval before going live',1],['Allow mentee self-registration',1],['Enable events module',1],['Enable QR ticketing',1],['Maintenance mode',0]];
  document.getElementById('toggles').innerHTML=toggles.map(([n,on],i)=>`
    <label class="flex items-center justify-between py-3 ${i?'border-t border-slate-100':''}"><span class="text-sm text-slate-600">${n}</span><input type="checkbox" ${on?'checked':''} class="sr-only peer"><span class="relative w-11 h-6 bg-slate-200 rounded-full peer-checked:bg-teal transition after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:w-5 after:h-5 after:bg-white after:rounded-full after:transition peer-checked:after:translate-x-5 cursor-pointer" onclick="this.previousElementSibling.click()"></span></label>`).join('');
  const saveBtn=document.getElementById('saveBtn'),savedMsg=document.getElementById('savedMsg');
  saveBtn.addEventListener('click',()=>{savedMsg.classList.remove('hidden');setTimeout(()=>savedMsg.classList.add('hidden'),2500);});
</script>
</body>
</html>
