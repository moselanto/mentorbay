<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — MentorBay</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='48' font-size='48' font-weight='bold' fill='%230B2A4A'%3EM%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { theme: { extend: {
      colors: { navy:{DEFAULT:'#0B2A4A',700:'#103a63',600:'#16487a',50:'#eef3f9'}, teal:{DEFAULT:'#1FA2BE',600:'#178098',400:'#3bb8d1',50:'#e9f7fa'} },
      fontFamily:{ sans:['Inter','ui-sans-serif','system-ui'] }, boxShadow:{ card:'0 4px 20px -6px rgba(11,42,74,0.12)' },
    }}}
  </script>
  <style>.cta-gradient{background:linear-gradient(150deg,#0B2A4A 0%,#16487a 55%,#178098 100%)}</style>
</head>
<body class="font-sans text-slate-700 bg-white antialiased">
  <div class="min-h-screen grid lg:grid-cols-2">

    <!-- BRAND PANEL -->
    <div class="cta-gradient hidden lg:flex flex-col justify-between p-12 text-white">
      <a href="index.html" class="flex items-center gap-2">
        <svg viewBox="0 0 64 64" class="h-9 w-9"><circle cx="32" cy="8" r="6" fill="#3bb8d1"/><circle cx="55" cy="20" r="6" fill="#fff"/><circle cx="55" cy="44" r="6" fill="#3bb8d1"/><circle cx="32" cy="56" r="6" fill="#fff"/><circle cx="9" cy="44" r="6" fill="#3bb8d1"/><circle cx="9" cy="20" r="6" fill="#fff"/><text x="32" y="41" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">M</text></svg>
        <span class="text-xl font-extrabold">Mentor<span class="text-teal-400">Bay</span></span>
      </a>
      <div>
        <h2 class="text-3xl font-extrabold leading-tight">Welcome back.</h2>
        <p class="mt-3 text-teal-50/90 max-w-sm">Pick up where you left off - your mentor, programs, and progress are waiting.</p>
        <img src="images/sd72apqakrkwgzn4m445fmh1g588v0mg.jpg" class="mt-8 rounded-2xl w-full max-w-sm h-56 object-cover shadow-card" alt="Mentorship" />
      </div>
      <p class="text-xs text-teal-50/60">© 2026 MentorBay · Connect · Grow · Succeed</p>
    </div>

    <!-- FORM PANEL -->
    <div class="flex items-center justify-center p-6 sm:p-12">
      <div class="w-full max-w-md">
        <a href="index.html" class="lg:hidden flex items-center gap-2 mb-8">
          <svg viewBox="0 0 64 64" class="h-8 w-8"><circle cx="32" cy="8" r="6" fill="#1FA2BE"/><circle cx="55" cy="20" r="6" fill="#0B2A4A"/><circle cx="55" cy="44" r="6" fill="#1FA2BE"/><circle cx="32" cy="56" r="6" fill="#0B2A4A"/><circle cx="9" cy="44" r="6" fill="#1FA2BE"/><circle cx="9" cy="20" r="6" fill="#0B2A4A"/><text x="32" y="41" text-anchor="middle" font-size="26" font-weight="800" fill="#0B2A4A">M</text></svg>
          <span class="text-xl font-extrabold text-navy">Mentor<span class="text-teal">Bay</span></span>
        </a>

        <h1 class="text-2xl font-extrabold text-navy">Log in to MentorBay</h1>
        <p class="text-slate-500 text-sm mt-1">Welcome back - let's keep growing.</p>

        <form class="mt-6 space-y-4" id="loginForm">
          <div>
            <label class="block text-sm font-semibold text-navy mb-1">Email address</label>
            <input required type="email" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-teal focus:border-teal outline-none" placeholder="you@example.com" />
          </div>
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="block text-sm font-semibold text-navy">Password</label>
              <a href="forgot-password.html" class="text-xs text-teal-600 font-medium hover:underline">Forgot password?</a>
            </div>
            <input required type="password" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-teal focus:border-teal outline-none" placeholder="Your password" />
          </div>
          <label class="flex items-center gap-2 text-sm text-slate-600"><input type="checkbox" class="accent-teal" /> Keep me signed in</label>
          <button type="submit" class="w-full py-3 bg-navy text-white font-semibold rounded-lg hover:bg-navy-700 transition">Log In</button>
        </form>

        <div class="flex items-center gap-3 my-5"><span class="flex-1 h-px bg-slate-200"></span><span class="text-xs text-slate-400">or</span><span class="flex-1 h-px bg-slate-200"></span></div>
        <button class="w-full py-3 border border-slate-200 rounded-lg font-semibold text-navy hover:border-teal transition flex items-center justify-center gap-2">
          <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.65l-3.57-2.77c-.99.66-2.26 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.11a6.6 6.6 0 0 1 0-4.22V7.05H2.18a11 11 0 0 0 0 9.9l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.05l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
          Continue with Google
        </button>
        <p class="text-center text-sm text-slate-500 mt-6">New to MentorBay? <a href="signup.html" class="text-teal-600 font-semibold hover:underline">Create an account</a></p>
      </div>
    </div>
  </div>
  <script>
    // Demo: login routes to the mentee dashboard (built in the next phase)
    document.getElementById('loginForm').addEventListener('submit', e=>{ e.preventDefault(); window.location.href='mentee-dashboard.html'; });
  </script>
</body>
</html>
