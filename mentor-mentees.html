    <div class="p-5 border-b border-slate-100"><a href="index.html" class="flex items-center gap-2"><svg viewBox="0 0 64 64" class="h-8 w-8"><circle cx="32" cy="8" r="6" fill="#1FA2BE"/><circle cx="55" cy="20" r="6" fill="#0B2A4A"/><circle cx="55" cy="44" r="6" fill="#1FA2BE"/><circle cx="32" cy="56" r="6" fill="#0B2A4A"/><circle cx="9" cy="44" r="6" fill="#1FA2BE"/><circle cx="9" cy="20" r="6" fill="#0B2A4A"/><text x="32" y="41" text-anchor="middle" font-size="26" font-weight="800" fill="#0B2A4A">M</text></svg><span class="text-lg font-extrabold text-navy">Mentor<span class="text-teal">Bay</span></span></a></div>
    <nav class="flex-1 overflow-y-auto p-3 space-y-1 text-sm font-medium">
      <a href="mentor-dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Dashboard</a>
      <a href="mentor-mentees.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-navy text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>My Mentees</a>
      <a href="mentor-applications.html" class="flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><span class="flex items-center gap-3"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>Applications</span><span class="text-xs bg-teal text-white rounded-full px-2 py-0.5">3</span></a>
      <a href="mentor-programs.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>My Programs</a>
      <a href="mentor-sessions.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Sessions</a>
      <a href="mentor-events.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7M3 7l2-3h14l2 3M3 7h18"/></svg>My Events</a>
      <a href="mentor-reviews.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Reviews</a>
      <a href="mentor-articles.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Articles</a>
      <a href="mentor-earnings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Earnings</a>
      <a href="mentor-settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg>Settings</a>
    </nav>
  </aside>
  <div id="overlay" class="fixed inset-0 bg-black/30 z-30 hidden lg:hidden"></div>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-100"><div class="flex items-center gap-4 px-4 sm:px-6 h-16"><button id="menuBtn" class="lg:hidden p-2 text-navy"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><h1 class="font-bold text-navy">My Mentees</h1><div class="flex items-center gap-2 ml-auto"><img src="images/sd7erhqwt022qcj3zh7r9nt7a188tncb.jpg" class="w-9 h-9 rounded-full object-cover" alt="Jane"><div class="hidden sm:block leading-tight"><p class="text-sm font-bold text-navy">Jane Wanjiku</p><p class="text-xs text-slate-400">Mentor</p></div></div></div></header>

    <main class="p-4 sm:p-6 lg:p-8">
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-2xl shadow-card p-5 text-center"><p class="text-2xl font-extrabold text-navy">124</p><p class="text-xs text-slate-400">Total Mentees</p></div>
        <div class="bg-white rounded-2xl shadow-card p-5 text-center"><p class="text-2xl font-extrabold text-navy">32</p><p class="text-xs text-slate-400">Active</p></div>
        <div class="bg-white rounded-2xl shadow-card p-5 text-center"><p class="text-2xl font-extrabold text-navy">92</p><p class="text-xs text-slate-400">Completed</p></div>
        <div class="bg-white rounded-2xl shadow-card p-5 text-center"><p class="text-2xl font-extrabold text-navy">98%</p><p class="text-xs text-slate-400">Success Rate</p></div>
      </div>

      <div class="bg-white rounded-2xl shadow-card overflow-hidden">
        <div class="flex flex-col sm:flex-row gap-3 p-4 border-b border-slate-100">
          <div class="relative flex-1"><svg class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="search" type="text" placeholder="Search mentees..." class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-teal outline-none text-sm" /></div>
          <select id="status" class="px-3 py-2.5 rounded-lg border border-slate-200 text-sm font-medium text-navy focus:ring-2 focus:ring-teal outline-none"><option value="">All Status</option><option>Active</option><option>Completed</option></select>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 text-slate-500"><tr><th class="text-left font-semibold px-5 py-3">Mentee</th><th class="text-left font-semibold px-5 py-3">Program</th><th class="text-left font-semibold px-5 py-3">Status</th><th class="text-left font-semibold px-5 py-3">Period</th><th class="text-left font-semibold px-5 py-3">Progress</th><th class="text-left font-semibold px-5 py-3">Rating</th><th class="px-5 py-3"></th></tr></thead>
            <tbody id="rows" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script>
  const menuBtn=document.getElementById('menuBtn'),sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay');
  menuBtn.addEventListener('click',()=>{sidebar.classList.remove('-translate-x-full');overlay.classList.remove('hidden');});
  overlay.addEventListener('click',()=>{sidebar.classList.add('-translate-x-full');overlay.classList.add('hidden');});
  const IMG='images/';
  const M=[
    {name:'Janet Mwangi',email:'janet.m@example.com',img:'sd728rcfrx0j7wrnhaa2zh0ya188vf7q',program:'Career Accelerator',status:'Active',period:'Jan 2026 - Present',progress:72,rating:'5.0'},
    {name:'Brian Otieno',email:'brian.o@example.com',img:'sd79gt2ajkr4serddsw8cebepn88v870',program:'Leadership Mastery',status:'Active',period:'Feb 2026 - Present',progress:60,rating:'4.8'},
    {name:'Faith Kemunto',email:'faith.k@example.com',img:'sd76649zdx97w9ve28wfndra6d88vdek',program:'Career Accelerator',status:'Active',period:'Mar 2026 - Present',progress:88,rating:'5.0'},
    {name:'Grace Njeri',email:'grace.n@example.com',img:'sd73mtg2fv8ezekjw91j55w0xs88tmdj',program:'Career Accelerator',status:'Completed',period:'Aug 2025 - Dec 2025',progress:100,rating:'5.0'},
    {name:'Kevin Mwangi',email:'kevin.m@example.com',img:'sd75by8ns0j4qabn92ryzmvjp988v394',program:'Leadership Mastery',status:'Completed',period:'May 2025 - Jul 2025',progress:100,rating:'4.9'},
    {name:'Lillian Wambui',email:'lillian.w@example.com',img:'sd723egrf1asak9t0sd16pdyf188vn53',program:'Leadership Mastery',status:'Active',period:'Apr 2026 - Present',progress:40,rating:'4.7'},
  ];
  const tbody=document.getElementById('rows');
  function render(){
    const q=document.getElementById('search').value.trim().toLowerCase(), st=document.getElementById('status').value;
    tbody.innerHTML=M.filter(m=>(!q||(m.name+m.email+m.program).toLowerCase().includes(q))&&(!st||m.status===st)).map(m=>`
      <tr class="hover:bg-slate-50">
        <td class="px-5 py-3"><div class="flex items-center gap-3"><img src="${IMG}${m.img}.jpg" class="w-9 h-9 rounded-full object-cover" alt=""><div><p class="font-semibold text-navy">${m.name}</p><p class="text-xs text-slate-400">${m.email}</p></div></div></td>
        <td class="px-5 py-3 text-slate-600">${m.program}</td>
        <td class="px-5 py-3"><span class="text-xs font-semibold ${m.status==='Active'?'text-teal-600 bg-teal-50':'text-slate-500 bg-slate-100'} px-2.5 py-1 rounded-full">${m.status}</span></td>
        <td class="px-5 py-3 text-slate-500 text-xs">${m.period}</td>
        <td class="px-5 py-3"><div class="flex items-center gap-2"><div class="w-20 h-1.5 bg-slate-100 rounded-full"><div class="h-full bg-teal rounded-full" style="width:${m.progress}%"></div></div><span class="text-xs font-semibold text-navy">${m.progress}%</span></div></td>
        <td class="px-5 py-3 text-sm"><span class="text-amber-400">★</span> ${m.rating}</td>
        <td class="px-5 py-3 text-right"><a href="#" class="text-xs font-semibold text-teal-600">View</a></td>
      </tr>`).join('');
  }
  document.getElementById('search').addEventListener('input',render);
  document.getElementById('status').addEventListener('change',render);
  render();
</script>
</body>
</html>
