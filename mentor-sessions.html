    <nav class="flex-1 overflow-y-auto p-3 space-y-1 text-sm font-medium">
      <a href="mentor-dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Dashboard</a>
      <a href="mentor-mentees.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>My Mentees</a>
      <a href="mentor-applications.html" class="flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><span class="flex items-center gap-3"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>Applications</span><span class="text-xs bg-teal text-white rounded-full px-2 py-0.5">3</span></a>
      <a href="mentor-programs.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>My Programs</a>
      <a href="mentor-sessions.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-navy text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Sessions</a>
      <a href="mentor-events.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7M3 7l2-3h14l2 3M3 7h18"/></svg>My Events</a>

      <a href="mentor-articles.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Articles</a>

    </nav>
  </aside>
  <div id="overlay" class="fixed inset-0 bg-black/30 z-30 hidden lg:hidden"></div>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-100"><div class="flex items-center gap-4 px-4 sm:px-6 h-16"><button id="menuBtn" class="lg:hidden p-2 text-navy"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><h1 class="font-bold text-navy">Sessions</h1><button class="ml-auto px-4 py-2.5 bg-navy text-white text-sm font-semibold rounded-lg hover:bg-navy-700 transition">+ Schedule Session</button></div></header>

    <main class="p-4 sm:p-6 lg:p-8 max-w-4xl">
      <div class="inline-flex bg-white rounded-lg border border-slate-200 p-1 mb-6">
        <button data-w="upcoming" class="when-btn px-5 py-2 text-sm font-semibold rounded-md bg-navy text-white">Upcoming</button>
        <button data-w="past" class="when-btn px-5 py-2 text-sm font-semibold rounded-md text-slate-500">Past</button>
      </div>
      <div class="space-y-4" id="list"></div>
    </main>
  </div>
</div>
<script>
  const menuBtn=document.getElementById('menuBtn'),sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay');
  menuBtn.addEventListener('click',()=>{sidebar.classList.remove('-translate-x-full');overlay.classList.remove('hidden');});
  overlay.addEventListener('click',()=>{sidebar.classList.add('-translate-x-full');overlay.classList.add('hidden');});
  const IMG='images/';let when='upcoming';
  const S={upcoming:[
    {mon:'JUN',day:'17',title:'Interview Prep',mentee:'Janet Mwangi',img:'sd728rcfrx0j7wrnhaa2zh0ya188vf7q',time:'Today · 10:00 AM',via:'Zoom'},
    {mon:'JUN',day:'17',title:'Goal Review',mentee:'Brian Otieno',img:'sd79gt2ajkr4serddsw8cebepn88v870',time:'Today · 3:00 PM',via:'Google Meet'},
    {mon:'JUN',day:'18',title:'Leadership 1:1',mentee:'Faith Kemunto',img:'sd76649zdx97w9ve28wfndra6d88vdek',time:'Tomorrow · 11:00 AM',via:'Zoom'},
  ],past:[
    {mon:'JUN',day:'14',title:'Resume Review',mentee:'Janet Mwangi',img:'sd728rcfrx0j7wrnhaa2zh0ya188vf7q',time:'Jun 14 · 10:00 AM',via:'Zoom'},
    {mon:'JUN',day:'10',title:'Career Mapping',mentee:'Lillian Wambui',img:'sd723egrf1asak9t0sd16pdyf188vn53',time:'Jun 10 · 2:00 PM',via:'Zoom'},
  ]};
  const list=document.getElementById('list');
  function render(){list.innerHTML=S[when].map(s=>`
    <div class="bg-white rounded-2xl shadow-card p-5 flex flex-col sm:flex-row sm:items-center gap-4">
      <div class="bg-teal-50 rounded-xl px-4 py-3 text-center shrink-0"><p class="text-xs font-bold text-teal-600">${s.mon}</p><p class="text-2xl font-extrabold text-navy">${s.day}</p></div>
      <img src="${IMG}${s.img}.jpg" class="w-11 h-11 rounded-full object-cover" alt="">
      <div class="flex-1"><p class="font-bold text-navy">${s.title} <span class="font-normal text-slate-400 text-sm">with ${s.mentee}</span></p><p class="text-sm text-slate-500 mt-1">${s.time} · ${s.via}</p></div>
      ${when==='upcoming'?'<div class="flex gap-2"><button class="px-4 py-2.5 bg-navy text-white text-sm font-semibold rounded-lg hover:bg-navy-700 transition">Start</button><button class="px-4 py-2.5 border border-slate-200 text-navy text-sm font-semibold rounded-lg hover:border-teal transition">Reschedule</button></div>':'<a href="#" class="px-4 py-2.5 border border-slate-200 text-navy text-sm font-semibold rounded-lg hover:border-teal transition">Add Notes</a>'}
    </div>`).join('');}
  document.querySelectorAll('.when-btn').forEach(b=>b.addEventListener('click',()=>{when=b.dataset.w;document.querySelectorAll('.when-btn').forEach(x=>{x.classList.remove('bg-navy','text-white');x.classList.add('text-slate-500');});b.classList.add('bg-navy','text-white');b.classList.remove('text-slate-500');render();}));
  render();
</script>
</body>
</html>
