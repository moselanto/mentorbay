<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — MentorBay</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='48' font-size='48' font-weight='bold' fill='%230B2A4A'%3EM%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { theme: { extend: {
      colors: { navy:{DEFAULT:'#0B2A4A',700:'#103a63',600:'#16487a',50:'#eef3f9'}, teal:{DEFAULT:'#1FA2BE',600:'#178098',400:'#3bb8d1',50:'#e9f7fa'} },
      fontFamily:{ sans:['Inter','ui-sans-serif','system-ui'] }, boxShadow:{ card:'0 4px 20px -6px rgba(11,42,74,0.12)' },
    }}}
  </script>
</head>
<body class="font-sans text-slate-700 bg-slate-50 antialiased">
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-card p-8">
      <a href="index.html" class="flex items-center gap-2 mb-8">
        <svg viewBox="0 0 64 64" class="h-8 w-8"><circle cx="32" cy="8" r="6" fill="#1FA2BE"/><circle cx="55" cy="20" r="6" fill="#0B2A4A"/><circle cx="55" cy="44" r="6" fill="#1FA2BE"/><circle cx="32" cy="56" r="6" fill="#0B2A4A"/><circle cx="9" cy="44" r="6" fill="#1FA2BE"/><circle cx="9" cy="20" r="6" fill="#0B2A4A"/><text x="32" y="41" text-anchor="middle" font-size="26" font-weight="800" fill="#0B2A4A">M</text></svg>
        <span class="text-xl font-extrabold text-navy">Mentor<span class="text-teal">Bay</span></span>
      </a>

      <div id="formView">
        <h1 class="text-2xl font-extrabold text-navy">Reset your password</h1>
        <p class="text-slate-500 text-sm mt-1">Enter your email and we'll send you a reset link.</p>
        <form class="mt-6 space-y-4" id="resetForm">
          <div>
            <label class="block text-sm font-semibold text-navy mb-1">Email address</label>
            <input required type="email" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-teal focus:border-teal outline-none" placeholder="you@example.com" />
          </div>
          <button type="submit" class="w-full py-3 bg-navy text-white font-semibold rounded-lg hover:bg-navy-700 transition">Send reset link</button>
        </form>
      </div>

      <div id="doneView" class="hidden text-center">
        <div class="w-14 h-14 mx-auto rounded-full bg-teal-50 grid place-items-center mb-4">
          <svg class="w-7 h-7 text-teal" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
        </div>
        <h1 class="text-xl font-extrabold text-navy">Check your inbox</h1>
        <p class="text-slate-500 text-sm mt-2">If an account exists for that email, we've sent a password reset link. It may take a minute to arrive.</p>
      </div>

      <p class="text-center text-sm text-slate-500 mt-6"><a href="login.html" class="text-teal-600 font-semibold hover:underline">← Back to login</a></p>
    </div>
  </div>
  <script>
    document.getElementById('resetForm').addEventListener('submit', e=>{
      e.preventDefault();
      document.getElementById('formView').classList.add('hidden');
      document.getElementById('doneView').classList.remove('hidden');
    });
  </script>
</body>
</html>
