  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

</head>
<body class="font-sans text-slate-700 bg-slate-50 antialiased">
<div class="flex min-h-screen">
  <aside id="sidebar" class="fixed lg:sticky top-0 inset-y-0 left-0 z-40 w-64 h-screen bg-white border-r border-slate-100 flex flex-col -translate-x-full lg:translate-x-0 transition-transform">
    <div class="p-5 border-b border-slate-100"><a href="index.html" class="flex items-center gap-2"><svg viewBox="0 0 64 64" class="h-8 w-8"><circle cx="32" cy="8" r="6" fill="#1FA2BE"/><circle cx="55" cy="20" r="6" fill="#0B2A4A"/><circle cx="55" cy="44" r="6" fill="#1FA2BE"/><circle cx="32" cy="56" r="6" fill="#0B2A4A"/><circle cx="9" cy="44" r="6" fill="#1FA2BE"/><circle cx="9" cy="20" r="6" fill="#0B2A4A"/><text x="32" y="41" text-anchor="middle" font-size="26" font-weight="800" fill="#0B2A4A">M</text></svg><span class="text-lg font-extrabold text-navy">Mentor<span class="text-teal">Bay</span></span></a></div>
    <nav class="flex-1 overflow-y-auto p-3 space-y-1 text-sm font-medium">
      <a href="mentor-dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Dashboard</a>
      <a href="mentor-mentees.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>My Mentees</a>
      <a href="mentor-applications.html" class="flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><span class="flex items-center gap-3"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>Applications</span><span class="text-xs bg-teal text-white rounded-full px-2 py-0.5">3</span></a>
      <a href="mentor-programs.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>My Programs</a>
      <a href="mentor-sessions.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Sessions</a>
      <a href="mentor-events.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-navy text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7M3 7l2-3h14l2 3M3 7h18"/></svg>My Events</a>
      <a href="mentor-reviews.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Reviews</a>
      <a href="mentor-articles.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Articles</a>
      <a href="mentor-earnings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Earnings</a>
      <a href="mentor-settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg>Settings</a>
    </nav>
  </aside>
  <div id="overlay" class="fixed inset-0 bg-black/30 z-30 hidden lg:hidden"></div>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-100"><div class="flex items-center gap-4 px-4 sm:px-6 h-16"><button id="menuBtn" class="lg:hidden p-2 text-navy"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><h1 class="font-bold text-navy">My Events</h1><button class="ml-auto px-4 py-2.5 bg-navy text-white text-sm font-semibold rounded-lg hover:bg-navy-700 transition">+ Create Event</button></div></header>

    <main class="p-4 sm:p-6 lg:p-8">
      <div class="inline-flex bg-white rounded-lg border border-slate-200 p-1 mb-6">
        <button data-w="upcoming" class="when-btn px-5 py-2 text-sm font-semibold rounded-md bg-navy text-white">Upcoming</button>
        <button data-w="past" class="when-btn px-5 py-2 text-sm font-semibold rounded-md text-slate-500">Past</button>
      </div>
      <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-6" id="grid"></div>
    </main>
  </div>
</div>
<script>
  const menuBtn=document.getElementById('menuBtn'),sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay');
  menuBtn.addEventListener('click',()=>{sidebar.classList.remove('-translate-x-full');overlay.classList.remove('hidden');});
  overlay.addEventListener('click',()=>{sidebar.classList.add('-translate-x-full');overlay.classList.add('hidden');});
  const IMG='images/';let when='upcoming';
  const E={upcoming:[
    {title:'Women in Leadership Forum',img:'sd7fbrdmwf1ba8zryhj7mxhy6188vaw2',date:'Jul 10, 2026',type:'Online',going:80},
    {title:'Career Clarity Masterclass',img:'sd7cw7fxc5jdak3bhrek7g334188tm52',date:'Jul 24, 2026',type:'In-person',going:45},
  ],past:[
    {title:'Resume Workshop',img:'sd7cxyvmncgt75zcbvkjs66p7s88tgjf',date:'May 15, 2026',type:'Online',going:210},
  ]};
  const grid=document.getElementById('grid');
  function render(){grid.innerHTML=E[when].map(e=>`
    <div class="bg-white rounded-2xl shadow-card overflow-hidden">
      <div class="relative"><img src="${IMG}${e.img}.jpg" class="w-full h-32 object-cover ${when==='past'?'grayscale':''}" alt=""><span class="absolute top-3 right-3 text-xs font-semibold ${e.type==='Online'?'bg-teal':'bg-navy'} text-white px-2.5 py-1 rounded-full">${e.type}</span></div>
      <div class="p-5">
        <h3 class="font-bold text-navy">${e.title}</h3>
        <p class="text-xs text-slate-500 mt-2">📅 ${e.date} · 👥 ${e.going} ${when==='past'?'attended':'registered'}</p>
        <div class="flex gap-2 mt-4">
          <button class="flex-1 py-2.5 bg-navy text-white text-sm font-semibold rounded-lg hover:bg-navy-700 transition">${when==='past'?'View Report':'Manage'}</button>
          <a href="event-detail.html" class="flex-1 text-center py-2.5 border border-slate-200 text-navy text-sm font-semibold rounded-lg hover:border-teal transition">Preview</a>
        </div>
      </div>
    </div>`).join('');}
  document.querySelectorAll('.when-btn').forEach(b=>b.addEventListener('click',()=>{when=b.dataset.w;document.querySelectorAll('.when-btn').forEach(x=>{x.classList.remove('bg-navy','text-white');x.classList.add('text-slate-500');});b.classList.add('bg-navy','text-white');b.classList.remove('text-slate-500');render();}));
  render();
</script>
</body>
</html>
