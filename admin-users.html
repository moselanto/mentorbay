<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users — MentorBay Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='48' font-size='48' font-weight='bold' fill='%230B2A4A'%3EM%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>tailwind.config={theme:{extend:{colors:{navy:{DEFAULT:'#0B2A4A',700:'#103a63',600:'#16487a',50:'#eef3f9'},teal:{DEFAULT:'#1FA2BE',600:'#178098',400:'#3bb8d1',50:'#e9f7fa'}},fontFamily:{sans:['Inter','ui-sans-serif','system-ui']},boxShadow:{card:'0 4px 20px -6px rgba(11,42,74,0.12)'}}}}</script>
</head>
<body class="font-sans text-slate-700 bg-slate-50 antialiased">
<div class="flex min-h-screen">
  <aside id="sidebar" class="fixed lg:sticky top-0 inset-y-0 left-0 z-40 w-64 h-screen bg-navy text-slate-300 flex flex-col -translate-x-full lg:translate-x-0 transition-transform">
    <div class="p-5 border-b border-white/10"><a href="index.html" class="flex items-center gap-2"><svg viewBox="0 0 64 64" class="h-8 w-8"><circle cx="32" cy="8" r="6" fill="#3bb8d1"/><circle cx="55" cy="20" r="6" fill="#fff"/><circle cx="55" cy="44" r="6" fill="#3bb8d1"/><circle cx="32" cy="56" r="6" fill="#fff"/><circle cx="9" cy="44" r="6" fill="#3bb8d1"/><circle cx="9" cy="20" r="6" fill="#fff"/><text x="32" y="41" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">M</text></svg><span class="text-lg font-extrabold text-white">Mentor<span class="text-teal-400">Bay</span></span></a><p class="text-[10px] font-semibold text-teal-400 mt-1 ml-10 -mt-1">ADMIN</p></div>
    <nav class="flex-1 overflow-y-auto p-3 space-y-1 text-sm font-medium">
      <a href="admin-dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Dashboard</a>
      <a href="admin-approvals.html" class="flex items-center justify-between px-3 py-2.5 rounded-lg hover:bg-white/5"><span class="flex items-center gap-3"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 11 2 2 4-4"/></svg>Mentor Approvals</span><span class="text-xs bg-teal text-white rounded-full px-2 py-0.5">5</span></a>
      <a href="admin-users.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-white/10 text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>Users</a>
      <a href="admin-moderation.html" class="flex items-center justify-between px-3 py-2.5 rounded-lg hover:bg-white/5"><span class="flex items-center gap-3"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Content</span><span class="text-xs bg-rose-500 text-white rounded-full px-2 py-0.5">2</span></a>
      <a href="admin-reports.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="8"/><rect x="12" y="6" width="3" height="12"/><rect x="17" y="13" width="3" height="5"/></svg>Reports</a>
      <a href="admin-settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg>Settings</a>
    </nav>
  </aside>
  <div id="overlay" class="fixed inset-0 bg-black/30 z-30 hidden lg:hidden"></div>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-100"><div class="flex items-center gap-4 px-4 sm:px-6 h-16"><button id="menuBtn" class="lg:hidden p-2 text-navy"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><h1 class="font-bold text-navy">User Management</h1></div></header>

    <main class="p-4 sm:p-6 lg:p-8">
      <div class="bg-white rounded-2xl shadow-card overflow-hidden">
        <div class="flex flex-col sm:flex-row gap-3 p-4 border-b border-slate-100">
          <div class="relative flex-1"><svg class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="search" type="text" placeholder="Search users by name or email..." class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-teal outline-none text-sm" /></div>
          <select id="role" class="px-3 py-2.5 rounded-lg border border-slate-200 text-sm font-medium text-navy focus:ring-2 focus:ring-teal outline-none"><option value="">All Roles</option><option>Mentor</option><option>Mentee</option><option>Admin</option></select>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 text-slate-500"><tr><th class="text-left font-semibold px-5 py-3">User</th><th class="text-left font-semibold px-5 py-3">Role</th><th class="text-left font-semibold px-5 py-3">Status</th><th class="text-left font-semibold px-5 py-3">Joined</th><th class="px-5 py-3"></th></tr></thead>
            <tbody id="rows" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script>
  const menuBtn=document.getElementById('menuBtn'),sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay');
  menuBtn.addEventListener('click',()=>{sidebar.classList.remove('-translate-x-full');overlay.classList.remove('hidden');});
  overlay.addEventListener('click',()=>{sidebar.classList.add('-translate-x-full');overlay.classList.add('hidden');});
  const IMG='images/';
  const U=[
    {name:'Jane Wanjiku',email:'jane.w@example.com',img:'sd7erhqwt022qcj3zh7r9nt7a188tncb',role:'Mentor',status:'Active',joined:'Mar 2025'},
    {name:'Janet Mwangi',email:'janet.m@example.com',img:'sd728rcfrx0j7wrnhaa2zh0ya188vf7q',role:'Mentee',status:'Active',joined:'Jan 2026'},
    {name:'John Kamau',email:'john.k@example.com',img:'sd7fd2ygetvv1t14epgbhnf31s88vgsk',role:'Mentor',status:'Active',joined:'Feb 2025'},
    {name:'Brian Otieno',email:'brian.o@example.com',img:'sd79gt2ajkr4serddsw8cebepn88v870',role:'Mentee',status:'Active',joined:'Feb 2026'},
    {name:'Peter Kamau',email:'admin@mentorbay.com',img:'sd7cb0223na4m9xntwvezwxyz588veqn',role:'Admin',status:'Active',joined:'Jan 2025'},
    {name:'Spam Account',email:'spam123@example.com',img:'sd75vfdt7nphcmkepenfdabf9188vzec',role:'Mentee',status:'Suspended',joined:'Jun 2026'},
  ];
  const tbody=document.getElementById('rows');
  function render(){
    const q=document.getElementById('search').value.trim().toLowerCase(),r=document.getElementById('role').value;
    tbody.innerHTML=U.filter(u=>(!q||(u.name+u.email).toLowerCase().includes(q))&&(!r||u.role===r)).map((u,i)=>`
      <tr class="hover:bg-slate-50">
        <td class="px-5 py-3"><div class="flex items-center gap-3"><img src="${IMG}${u.img}.jpg" class="w-9 h-9 rounded-full object-cover" alt=""><div><p class="font-semibold text-navy">${u.name}</p><p class="text-xs text-slate-400">${u.email}</p></div></div></td>
        <td class="px-5 py-3"><span class="text-xs font-semibold ${u.role==='Mentor'?'text-teal-600 bg-teal-50':u.role==='Admin'?'text-indigo-500 bg-indigo-50':'text-slate-500 bg-slate-100'} px-2.5 py-1 rounded-full">${u.role}</span></td>
        <td class="px-5 py-3"><span class="text-xs font-semibold ${u.status==='Active'?'text-teal-600':'text-rose-500'}">● ${u.status}</span></td>
        <td class="px-5 py-3 text-slate-500 text-xs">${u.joined}</td>
        <td class="px-5 py-3 text-right"><button class="text-xs font-semibold ${u.status==='Active'?'text-rose-500':'text-teal-600'} hover:underline">${u.status==='Active'?'Suspend':'Reactivate'}</button></td>
      </tr>`).join('');
  }
  document.getElementById('search').addEventListener('input',render);
  document.getElementById('role').addEventListener('change',render);
  render();
</script>
</body>
</html>
